{% extends "base.html" %}

{% block title %}404 – Page Not Found | CLIMATEX{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="py-5">
        <div class="d-inline-flex p-4 rounded-circle mb-4" style="background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.25);">
            <i class="bi bi-compass text-info" style="font-size: 3.5rem;"></i>
        </div>
        <h1 class="display-3 fw-extrabold text-white mb-2">404</h1>
        <h2 class="h4 text-info fw-semibold mb-3">Page Not Found</h2>
        <p class="text-secondary mx-auto mb-4" style="max-width: 520px; font-size: 1.05rem;">
            The environmental simulation page or resource you requested could not be located.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-climatex-glow px-4">
                <i class="bi bi-house-door-fill me-1"></i> Return Home
            </a>
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-climatex-outline px-4">
                <i class="bi bi-speedometer2 me-1"></i> Go to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
